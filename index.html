*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  font-family:'Plus Jakarta Sans', Arial, sans-serif;
  color:#2d1a1e;
  background:#120709;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  padding:0;
}

.stage{
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:100%;
  height:100dvh;
  max-width:100%;
  margin:auto;
  position:relative;
  overflow:hidden;
  background: linear-gradient(160deg, #fffaf5 0%, #f9ece6 45%, #f2d8d0 100%) !important;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
}

/* Header & Live Clock */
.top{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:absolute;
  left:0;
  right:0;
  top:0;
  z-index:50;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(136, 14, 30, 0.08);
}
.brand-wrap{
  display: flex;
  flex-direction: column;
}
.brand{
  font-size:14px;
  font-weight:800;
  letter-spacing:.2em;
  color: #880e1f !important;
  line-height: 1.1;
}
.live-clock{
  font-size: 11px;
  font-weight: 600;
  color: #a81c32;
  margin-top: 2px;
}

/* Stylish Music Button */
.music{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background: linear-gradient(135deg, #ffffff 0%, #ffe4e8 100%);
  font-size:16px;
  color:#880e1f;
  cursor:pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 15px rgba(136, 14, 30, 0.15);
  position: relative;
}
.music::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid rgba(168, 28, 50, 0.3);
  animation: pulse-ring 2s infinite;
}

  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.1); opacity: 0.3; }
  100% { transform: scale(0.95); opacity: 0.8; }
}
